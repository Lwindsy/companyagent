      .muted { font: 500 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #657284; }
      .bullet { font: 500 17px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2b3f; }
      .goal-title { font: 800 22px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #075e34; }
      .goal-text { font: 500 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2b3f; }
