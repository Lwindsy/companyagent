<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #fbfcfb; }
      .header { fill: #eef6ff; stroke: #c9d7e9; stroke-width: 1.4; }
      .panel { fill: #f7fcf9; stroke: #cfe3d7; stroke-width: 1.5; }
      .band { fill: #f0faf4; stroke: #cfe3d7; stroke-width: 1.2; }
      .card { fill: #ffffff; stroke: #d7e1df; stroke-width: 1.4; }
      .blue-card { fill: #f3f9ff; stroke: #cad9e9; }
      .green-card { fill: #f7fcf9; stroke: #bfe2ce; }
      .orange-card { fill: #fff9ef; stroke: #efd7af; }
      .purple-card { fill: #f7f3ff; stroke: #d3c6ef; }
      .soft-card { fill: #fbfefd; stroke: #d6e6dc; }
      .title { font: 800 38px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #13213b; letter-spacing: 1px; }
      .subtitle { font: 500 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #657284; }
      .section-title { font: 800 27px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #08733d; }
      .label { font: 800 23px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #17243d; }
      .small { font: 500 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #25324b; }
      .muted { font: 500 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #657284; }
      .tiny { font: 800 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .green-text { fill: #08733d; }
      .orange-text { fill: #a85b00; }
      .purple-text { fill: #573c9b; }
      .blue { fill: #3165b7; }
      .green { fill: #14945b; }
      .orange { fill: #f47d22; }
      .purple { fill: #6045a9; }
      .line { stroke: #aeb8c4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #14945b; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .dashed { stroke-dasharray: 9 9; }
      .shadow { filter: url(#shadow); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d8e1df" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aeb8c4"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14945b"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <!-- Header -->
  <rect class="header shadow" x="32" y="28" width="1536" height="112" rx="18"/>
  <text class="title" x="66" y="78">多 Agent 与 Skills 注入关系</text>
  <text class="subtitle" x="66" y="110">用户消息先完成意图识别与结构化路由决策，再按 Agent 类型和关键词动态注入对应客服规范</text>
  <g transform="translate(1322,58)">
    <rect class="soft-card" width="196" height="48" rx="12"/>
    <circle class="green" cx="28" cy="24" r="14"/>
    <text class="tiny" x="23" y="29">热</text>
    <text class="small" x="52" y="30">Skills 可热加载</text>
  </g>

  <!-- Route flow -->
  <rect class="panel shadow" x="32" y="170" width="1536" height="590" rx="18"/>
  <rect class="band" x="62" y="198" width="1476" height="72" rx="14"/>
  <text class="section-title" x="92" y="244">路由链路：识别问题类型，生成主 Agent 与辅助 Agent 决策</text>

  <g transform="translate(92,310)">
    <rect class="card blue-card" width="250" height="126" rx="12"/>
    <circle class="blue" cx="44" cy="38" r="19"/>
    <text class="tiny" x="39" y="44">1</text>
    <text class="label" x="78" y="46">用户消息</text>
    <path d="M62 72 h130 a15 15 0 0 1 15 15 v24 a15 15 0 0 1 -15 15 h-62 l-25 20 v-20 h-43 a15 15 0 0 1 -15 -15 v-24 a15 15 0 0 1 15 -15z" fill="#ffffff" stroke="#3165b7" stroke-width="5"/>
    <text class="small" x="68" y="106">咨询 / 报错 / 退款</text>
  </g>

  <g transform="translate(452,310)">
    <rect class="card purple-card" width="270" height="126" rx="12"/>
    <circle class="purple" cx="44" cy="38" r="19"/>
    <text class="tiny" x="39" y="44">2</text>
    <text class="label" x="78" y="46">意图识别</text>
    <circle cx="116" cy="88" r="30" fill="#ffffff" stroke="#6045a9" stroke-width="5"/>
    <path d="M90 88 h52 M116 62 v52 M96 68 c13 13 26 26 39 39 M136 68 c-13 13 -26 26 -39 39" stroke="#6045a9" stroke-width="3" fill="none"/>
    <text class="small" x="165" y="84">LLM</text>
    <text class="muted" x="165" y="108">语义 + 规则</text>
  </g>

  <g transform="translate(832,310)">
    <rect class="card green-card" width="286" height="126" rx="12"/>
    <circle class="green" cx="44" cy="38" r="19"/>
    <text class="tiny" x="39" y="44">3</text>
    <text class="label" x="78" y="46">Agent 编排器</text>
    <circle class="green" cx="118" cy="88" r="32"/>
    <circle cx="98" cy="78" r="7" fill="#fff"/>
    <circle cx="138" cy="78" r="7" fill="#fff"/>
    <circle cx="118" cy="102" r="7" fill="#fff"/>
    <path d="M98 78 L118 102 L138 78" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="small" x="170" y="84">领域打分</text>
    <text class="muted" x="170" y="108">主辅 Agent</text>
  </g>

  <g transform="translate(1270,310)">
    <rect class="card blue-card" width="220" height="126" rx="12"/>
    <circle class="blue" cx="44" cy="38" r="19"/>
    <text class="tiny" x="39" y="44">4</text>
    <text class="label" x="78" y="46">模型回复</text>
    <text class="small" x="42" y="86">System Prompt</text>
    <text class="small" x="42" y="112">+ 动态 Skills</text>
  </g>

  <path class="line" d="M342 373 L452 373"/>
  <path class="line" d="M722 373 L832 373"/>
  <path class="line" d="M1118 373 L1270 373"/>

  <g transform="translate(1190,210)">
    <rect class="soft-card" width="316" height="46" rx="12"/>
    <circle class="green" cx="28" cy="23" r="12"/>
    <path d="M22 23 L27 29 L36 17" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="52" y="29">控制台提示当前加载的 Skill</text>
  </g>

  <path class="green-line" d="M975 436 C905 478 345 478 300 540"/>
  <path class="green-line" d="M975 436 C912 480 825 480 800 540"/>
  <path class="green-line" d="M975 436 C1048 478 1282 478 1300 540"/>

  <!-- Agent layer -->
  <text class="section-title" x="92" y="505">Agent 层：拆分职责边界，避免通用提示词互相污染</text>

  <g transform="translate(90,540)">
    <rect class="card green-card" width="420" height="160" rx="12"/>
    <circle class="green" cx="62" cy="60" r="34"/>
    <path class="green" d="M16 132 C24 94 43 80 62 80 C81 80 100 94 108 132 Z"/>
    <text class="label green-text" x="138" y="52">通用客服 Agent</text>
    <text class="muted" x="138" y="80">GeneralAgent</text>
    <text class="small" x="138" y="112">接待、澄清、订单、售后</text>
    <text class="small" x="138" y="140">必要时转人工或分流</text>
  </g>

  <g transform="translate(590,540)">
    <rect class="card orange-card" width="420" height="160" rx="12"/>
    <circle class="orange" cx="62" cy="60" r="34"/>
    <text x="45" y="72" font-family="Arial" font-size="34" font-weight="800" fill="#ffffff">&lt;/&gt;</text>
    <text class="label orange-text" x="138" y="52">技术支持 Agent</text>
    <text class="muted" x="138" y="80">TechnicalAgent</text>
    <text class="small" x="138" y="112">报错、接口、部署、日志</text>
    <text class="small" x="138" y="140">定位问题并给出排查步骤</text>
  </g>

  <g transform="translate(1090,540)">
    <rect class="card purple-card" width="420" height="160" rx="12"/>
    <circle class="purple" cx="62" cy="60" r="34"/>
    <path d="M46 52 h34 M46 68 h34 M56 38 v46 M70 38 v46" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text class="label purple-text" x="138" y="52">账单退款 Agent</text>
    <text class="muted" x="138" y="80">BillingAgent</text>
    <text class="small" x="138" y="112">扣款、退款、发票、订阅</text>
    <text class="small" x="138" y="140">按账务规范处理敏感问题</text>
  </g>

  <!-- Skills layer -->
  <rect class="panel shadow" x="32" y="790" width="1536" height="174" rx="18"/>
  <text class="section-title" x="62" y="836">Skills 注入：按顶部配置匹配文档，拼入本轮 system prompt</text>

  <g transform="translate(92,866)">
    <rect class="card green-card" width="420" height="70" rx="12"/>
    <rect x="28" y="18" width="52" height="38" rx="7" fill="#ffffff" stroke="#14945b" stroke-width="5"/>
    <text class="label green-text" x="102" y="30">通用客服规范</text>
    <text class="muted" x="102" y="56">agents: general / keywords: 咨询、订单、售后</text>
  </g>

  <g transform="translate(590,866)">
    <rect class="card orange-card" width="420" height="70" rx="12"/>
    <rect x="28" y="18" width="52" height="38" rx="7" fill="#ffffff" stroke="#f47d22" stroke-width="5"/>
    <text class="label orange-text" x="102" y="30">技术支持规范</text>
    <text class="muted" x="102" y="56">agents: technical / keywords: 报错、接口、500</text>
  </g>

  <g transform="translate(1088,866)">
    <rect class="card purple-card" width="420" height="70" rx="12"/>
    <rect x="28" y="18" width="52" height="38" rx="7" fill="#ffffff" stroke="#6045a9" stroke-width="5"/>
    <text class="label purple-text" x="102" y="30">账单退款规范</text>
    <text class="muted" x="102" y="56">agents: billing / keywords: 退款、扣款、发票</text>
  </g>

  <path class="green-line dashed" d="M300 866 L300 700"/>
  <path class="green-line dashed" d="M800 866 L800 700"/>
  <path class="green-line dashed" d="M1300 866 L1300 700"/>
</svg>
