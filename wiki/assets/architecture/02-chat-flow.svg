<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .bg { fill: #fbfcfb; }
      .header { fill: #eef6ff; stroke: #c9d7e9; stroke-width: 1.4; }
      .panel { fill: #f7fcf9; stroke: #cfe3d7; stroke-width: 1.5; }
      .band { fill: #f0faf4; stroke: #cfe3d7; stroke-width: 1.2; }
      .async-band { fill: #f8fbff; stroke: #d4dfed; stroke-width: 1.2; }
      .card { fill: #ffffff; stroke: #d7e1df; stroke-width: 1.4; }
      .blue-card { fill: #f3f9ff; stroke: #cad9e9; }
      .green-card { fill: #f7fcf9; stroke: #bfe2ce; }
      .orange-card { fill: #fff9ef; stroke: #efd7af; }
      .purple-card { fill: #f7f3ff; stroke: #d3c6ef; }
      .soft-card { fill: #fbfefd; stroke: #d6e6dc; }
      .title { font: 800 38px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #13213b; letter-spacing: 1px; }
      .subtitle { font: 500 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #657284; }
      .section-title { font: 800 27px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #08733d; }
      .label { font: 800 23px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #17243d; }
      .small { font: 500 18px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #25324b; }
      .muted { font: 500 16px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #657284; }
      .tiny { font: 800 15px "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .green-text { fill: #08733d; }
      .orange-text { fill: #a85b00; }
      .purple-text { fill: #573c9b; }
      .blue-text { fill: #245ca8; }
      .blue { fill: #3165b7; }
      .green { fill: #14945b; }
      .orange { fill: #f47d22; }
      .purple { fill: #6045a9; }
      .line { stroke: #aeb8c4; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .green-line { stroke: #14945b; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
      .blue-line { stroke: #4a86db; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dashed { stroke-dasharray: 9 9; }
      .shadow { filter: url(#shadow); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d8e1df" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#aeb8c4"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14945b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a86db"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1000"/>

  <!-- Header -->
  <rect class="header shadow" x="32" y="28" width="1536" height="112" rx="18"/>
  <text class="title" x="66" y="78">/chat 主链路架构</text>
  <text class="subtitle" x="66" y="110">从用户请求到记忆读取、知识库检索、意图识别、Agent 回复和画像更新</text>
  <g transform="translate(1272,58)">
    <rect class="soft-card" width="246" height="48" rx="12"/>
    <circle class="green" cx="28" cy="24" r="14"/>
    <text class="tiny" x="23" y="29">查</text>
    <text class="small" x="52" y="30">上下文 + 知识联合增强</text>
  </g>

  <!-- Main chain -->
  <rect class="panel shadow" x="32" y="170" width="1536" height="610" rx="18"/>
  <rect class="band" x="62" y="198" width="1476" height="72" rx="14"/>
  <text class="section-title" x="92" y="244">同步主链路：一次请求内完成上下文增强、路由、Skills 注入与模型回复</text>

  <!-- Row 1 -->
  <g transform="translate(92,320)">
    <rect class="card blue-card" width="280" height="132" rx="12"/>
    <circle class="blue" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">1</text>
    <text class="label blue-text" x="82" y="48">用户请求</text>
    <path d="M72 78 h118 a15 15 0 0 1 15 15 v26 a15 15 0 0 1 -15 15 h-55 l-28 22 v-22 h-35 a15 15 0 0 1 -15 -15 v-26 a15 15 0 0 1 15 -15z" fill="#ffffff" stroke="#3165b7" stroke-width="5"/>
    <text class="small" x="82" y="112">POST /chat</text>
  </g>

  <g transform="translate(452,320)">
    <rect class="card green-card" width="300" height="132" rx="12"/>
    <circle class="green" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">2</text>
    <text class="label green-text" x="82" y="48">读取记忆上下文</text>
    <rect x="76" y="78" width="76" height="46" rx="8" fill="#ffffff" stroke="#14945b" stroke-width="5"/>
    <circle cx="192" cy="101" r="25" fill="#ffffff" stroke="#14945b" stroke-width="5"/>
    <path d="M210 119 L232 141" stroke="#14945b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="muted" x="78" y="152">Redis 工作记忆 + 用户画像</text>
  </g>

  <g transform="translate(832,320)">
    <rect class="card orange-card" width="300" height="132" rx="12"/>
    <circle class="orange" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">3</text>
    <text class="label orange-text" x="82" y="48">RAG 知识库检索</text>
    <path d="M80 78 h70 v46 h-70z" fill="#ffffff" stroke="#f47d22" stroke-width="5"/>
    <path d="M160 86 h72 M160 104 h62 M160 122 h50" stroke="#f47d22" stroke-width="5" stroke-linecap="round"/>
    <text class="muted" x="80" y="152">查询改写 / 召回 / 重排</text>
  </g>

  <g transform="translate(1212,320)">
    <rect class="card purple-card" width="280" height="132" rx="12"/>
    <circle class="purple" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">4</text>
    <text class="label purple-text" x="82" y="48">意图识别</text>
    <circle cx="118" cy="100" r="31" fill="#ffffff" stroke="#6045a9" stroke-width="5"/>
    <path d="M92 100 h52 M118 74 v52 M98 80 c13 13 26 26 39 39 M138 80 c-13 13 -26 26 -39 39" stroke="#6045a9" stroke-width="3" fill="none"/>
    <text class="muted" x="168" y="99">LLM</text>
    <text class="muted" x="168" y="121">语义 + 规则</text>
  </g>

  <path class="line" d="M372 386 L452 386"/>
  <path class="line" d="M752 386 L832 386"/>
  <path class="line" d="M1132 386 L1212 386"/>

  <!-- Row 2, snake direction -->
  <path class="line" d="M1352 452 L1352 526"/>

  <g transform="translate(1212,526)">
    <rect class="card purple-card" width="280" height="132" rx="12"/>
    <circle class="purple" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">5</text>
    <text class="label purple-text" x="82" y="48">Agent 路由</text>
    <circle class="purple" cx="112" cy="98" r="32"/>
    <circle cx="94" cy="90" r="6" fill="#fff"/>
    <circle cx="130" cy="90" r="6" fill="#fff"/>
    <circle cx="112" cy="112" r="6" fill="#fff"/>
    <path d="M94 90 L112 112 L130 90" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text class="muted" x="164" y="96">通用 / 技术</text>
    <text class="muted" x="164" y="118">账单 / 降级</text>
  </g>

  <g transform="translate(832,526)">
    <rect class="card green-card" width="300" height="132" rx="12"/>
    <circle class="green" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">6</text>
    <text class="label green-text" x="82" y="48">动态 Skills 注入</text>
    <rect x="82" y="76" width="62" height="54" rx="8" fill="#ffffff" stroke="#14945b" stroke-width="5"/>
    <path d="M144 76 L168 100 L144 100 Z" fill="#dff4e8" stroke="#14945b" stroke-width="4"/>
    <text class="muted" x="184" y="96">按 Agent</text>
    <text class="muted" x="184" y="118">和关键词匹配</text>
  </g>

  <g transform="translate(452,526)">
    <rect class="card blue-card" width="300" height="132" rx="12"/>
    <circle class="blue" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">7</text>
    <text class="label blue-text" x="82" y="48">调用大模型</text>
    <path d="M84 84 C100 60 142 60 158 84 C174 108 154 130 122 130 C90 130 68 108 84 84 Z" fill="#ffffff" stroke="#3165b7" stroke-width="5"/>
    <text class="muted" x="176" y="96">Prompt</text>
    <text class="muted" x="176" y="118">Memory + RAG + Skills</text>
  </g>

  <g transform="translate(92,526)">
    <rect class="card green-card" width="280" height="132" rx="12"/>
    <circle class="green" cx="44" cy="40" r="20"/>
    <text class="tiny" x="39" y="45">8</text>
    <text class="label green-text" x="82" y="48">返回回复</text>
    <path d="M72 78 h118 a15 15 0 0 1 15 15 v24 a15 15 0 0 1 -15 15 h-32 l-28 22 v-22 h-58 a15 15 0 0 1 -15 -15 v-24 a15 15 0 0 1 15 -15z" fill="#ffffff" stroke="#14945b" stroke-width="5"/>
    <text class="small" x="82" y="112">ChatResponse</text>
  </g>

  <path class="line" d="M1212 592 L1132 592"/>
  <path class="line" d="M832 592 L752 592"/>
  <path class="line" d="M452 592 L372 592"/>

  <g transform="translate(1018,706)">
    <rect class="soft-card" width="442" height="44" rx="12"/>
    <circle class="green" cx="28" cy="22" r="12"/>
    <path d="M22 22 L27 28 L36 16" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="52" y="28">控制台可打印：本轮加载 general / technical / billing skill</text>
  </g>

  <!-- Async post-processing -->
  <rect class="panel shadow" x="32" y="810" width="1536" height="154" rx="18"/>
  <rect class="async-band" x="62" y="838" width="1476" height="48" rx="12"/>
  <text class="section-title" x="92" y="872">异步后处理：回复完成后补齐记忆与用户画像</text>

  <g transform="translate(282,908)">
    <rect class="card green-card" width="360" height="52" rx="12"/>
    <circle class="green" cx="32" cy="26" r="15"/>
    <text class="tiny" x="23" y="31">9</text>
    <text class="label green-text" x="62" y="23">写入工作记忆</text>
    <text class="muted" x="62" y="43">用户消息 + 助手回复</text>
  </g>

  <g transform="translate(812,908)">
    <rect class="card green-card" width="430" height="52" rx="12"/>
    <circle class="green" cx="34" cy="26" r="15"/>
    <text class="tiny" x="21" y="31">10</text>
    <text class="label green-text" x="66" y="23">异步更新用户画像</text>
    <text class="muted" x="66" y="43">写入 ChromaDB user_profile</text>
  </g>

  <path class="blue-line dashed" d="M232 658 C232 758 430 780 462 908"/>
  <path class="green-line" d="M642 934 L812 934"/>
</svg>
