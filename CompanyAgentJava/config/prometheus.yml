global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: companyagent-java
    environment: production

scrape_configs:
  - job_name: companyagent-java-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - companyagent-java:8080
        labels:
          service: companyagent-java

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
